[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalplab"
version = "0.2.0"
description = "Deterministic Binance USD-M futures research, microstructure recording, replay and shadow platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "websockets>=12",
  "pandas>=2.1",
  "numpy>=1.26",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "psutil>=5.9",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
scalp = "scalp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
